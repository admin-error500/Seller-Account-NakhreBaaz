name: Invoice regression tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/invoice-regression.yml'

permissions:
  contents: read

jobs:
  invoice-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
